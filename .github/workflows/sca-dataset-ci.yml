name: build-and-test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: auto   # go.mod bumps from upgrades (e.g. x/crypto -> go 1.26) download the required toolchain
      GOFLAGS: -mod=mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.6'   # version used for the verified baseline (go.mod: go 1.17)
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -count=1 ./...   # repo has no test files

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Front-end build (static/, no JS tests)
        working-directory: static
        run: npm install && npm run build
